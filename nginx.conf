server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # HTML ไม่ cache — แก้ index.html แล้วเห็นผลทันที
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # assets: ให้ revalidate ทุกครั้ง (etag/304) — Cloudflare กับมือถือจะไม่ค้างของเก่า
    location /assets/ {
        add_header Cache-Control "no-cache";
        etag on;
        try_files $uri =404;
    }

    # ไม่เสิร์ฟไฟล์ซ่อน และไม่ให้ list directory
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
